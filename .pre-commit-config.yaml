# Local security gate — "shift-left" (brief §3).
#
# These hooks run on `git commit`, BEFORE anything is pushed. They mirror the server-side
# controls in .github/workflows/devsecops.yml, so a developer gets the same verdict locally in
# seconds instead of waiting for CI. Because `git commit --no-verify` bypasses local hooks, the
# pipeline re-runs every one of these checks: the local gate is a fast first line, not the only one.
#
# Setup (once):  pip install pre-commit && pre-commit install      (see docs/SETUP.md)
# Manual run:    pre-commit run --all-files
repos:
  # --- generic hygiene ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: detect-private-key       # blocks a private key committed by mistake
      - id: check-merge-conflict     # blocks leftover conflict markers



  # HMRC swaps the two IDs: secrets_filecontent checks the file TYPE, secrets_filename the CONTENT.
  # The exclude regex is the lab's list of binary extensions, written as a single anchored pattern.
    # --- file-type check; Gitleaks below scans file contents ---
  - repo: https://github.com/hmrc/security-git-hooks
    rev: release/1.15.0
    hooks:
      - id: secrets_filecontent
        name: Checking staged files for sensitive file types
        exclude: '\.(tar|gz|jar|7z|rar|bz2|zip|gzip|war|ear|xlsx|xls|docx|doc|pptx|pdf|jpg|png|jpeg|tif|tiff|gif|bmp|webp|svg|ico|psd|exe|dll|dmg|deb|rpm)$'
  # --- secret scanning (same tool and version as the secrets_scan job) ---
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # --- SAST (same tool, version and rulesets as the sast job) ---
  - repo: https://github.com/returntocorp/semgrep
    rev: v1.165.0
    hooks:
      - id: semgrep
        args: [--config, p/security-audit, --config, security/semgrep-custom.yml, --error, --metrics, "off"]

  # --- Python SAST on our own pipeline scripts (security/*.py) ---
  # B101 (assert) is skipped on purpose: security/test_gate.py is built from asserts.
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: [--skip, B101]

  # --- project-specific local hooks ---
  - repo: local
    hooks:
      # eslint-plugin-security, without type information so it stays fast. It blocks on the rules
      # set to "error" in the config (eval on user input, child_process...); the rest are warnings.
      # Needs the project's node_modules: run `npm install --ignore-scripts` once (docs/SETUP.md).
      - id: eslint-security
        name: ESLint security rules (eslint-plugin-security)
        language: system
        entry: npx --no-install eslint --config security/eslint-security.config.mjs --no-warn-ignored
        types_or: [javascript, ts]
      # A dependency change must not introduce a NEW critical vulnerability (baseline = accepted-risks.json).
      - id: npm-audit
        name: npm audit on dependency changes (a new critical blocks)
        language: python
        entry: python security/deps_hook.py
        files: ^(frontend/)?package\.json$
