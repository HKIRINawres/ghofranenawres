# SonarQube Cloud analysis — job `sonarqube` in .github/workflows/devsecops.yml (brief §6).
# The token comes from the SONAR_TOKEN GitHub secret, never from this file.
#
# >>> TO CUSTOMISE <<<  Create a free project on https://sonarcloud.io, then replace the two
# values below with YOUR own organisation key and project key (SonarCloud shows them on the
# project's "Administration > Analysis Method" page). Until then the sonarqube job is skipped
# if SONAR_TOKEN is not set, so the rest of the pipeline is unaffected.
sonar.organization=VOTRE_ORGANISATION
sonar.projectKey=VOTRE_CLE_PROJET
sonar.projectName=devsecops-pipeline (OWASP Juice Shop)

sonar.sources=.
# Exclude dependencies, build output, test code and the challenges' intentionally vulnerable
# code-fix snippets, so SonarQube reports on the real application surface only.
sonar.exclusions=**/node_modules/**,build/**,dist/**,frontend/dist/**,frontend/src/assets/**,data/static/codefixes/**,test/**,**/*.spec.ts,vagrant/**,monitoring/**,screenshots/**,ftp/**,uploads/**,**/__pycache__/**
# Findings of the other scanners (Semgrep, Gitleaks, Trivy fs, Checkov), converted by
# security/sonar_issues.py, so every tool's results are centralised in one dashboard with history.
sonar.externalIssuesReportPaths=security/out/sonar-issues.json
